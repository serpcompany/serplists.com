<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Tag Manager -->
    <script>
      (function (win, doc) {
        // Tags in the container read location.href, so a document whose URL carries a
        // share or invite token, a reset token or an email address never loads it, nor
        // one whose `next` return path points at such a page. Keep in step with
        // src/lib/analyticsUrl.ts (tests/unit/security/gtmBootstrap.test.ts).
        function isSensitiveLocation(pathname, search) {
          var path = pathname;
          try {
            path = decodeURIComponent(pathname);
          } catch (_error) {
            path = pathname;
          }
          path = path.replace(/^\/+/, '/');
          if (/^\/(share|team-invites|reset-password)(\/|$)/i.test(path)) return true;
          var sensitiveKeys = ['token', 'email', 'code', 'state'];
          var sensitive = false;
          new URLSearchParams(search).forEach(function (value, key) {
            var name = key.toLowerCase();
            if (sensitiveKeys.indexOf(name) !== -1) sensitive = true;
            if (name === 'next' && isSensitiveReturnPath(value)) sensitive = true;
          });
          return sensitive;
        }

        function isSensitiveReturnPath(value) {
          var withoutHash = value.split('#')[0];
          var queryStart = withoutHash.indexOf('?');
          return queryStart === -1
            ? isSensitiveLocation(withoutHash, '')
            : isSensitiveLocation(withoutHash.slice(0, queryStart), withoutHash.slice(queryStart));
        }

        var skipTagManager = true;
        try {
          skipTagManager = isSensitiveLocation(win.location.pathname, win.location.search);
        } catch (_error) {
          skipTagManager = true;
        }
        if (skipTagManager) return;

        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(win,doc,'script','dataLayer','GTM-PZZFQBGG');
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->
    <title>SERP Lists</title>
    <!-- Crawlers that do not run JavaScript only see these. data-rh hands them to
         react-helmet-async, so a page's SEOHead replaces them instead of adding a second
         copy. Keep them identical to the defaults in DocumentHeadProvider.tsx
         (tests/unit/components/documentHeadMeta.test.tsx). On public template, category
         and library pages, functions/seo/ fills in the page's own title, description,
         og:type and canonical URL before this reaches the crawler. -->
    <meta name="description" content="Create and run checklists for your processes." data-rh="true" />

    <meta property="og:title" content="SERP Lists" data-rh="true" />
    <meta property="og:description" content="Create and run checklists for your processes." data-rh="true" />
    <meta property="og:type" content="website" data-rh="true" />
    <meta property="og:image" content="https://serplists.com/og-default.png" data-rh="true" />
    <meta property="og:image:width" content="1200" data-rh="true" />
    <meta property="og:image:height" content="630" data-rh="true" />
    <meta property="og:image:alt" content="SERP Lists" data-rh="true" />

    <meta name="twitter:card" content="summary_large_image" data-rh="true" />
    <meta name="twitter:image" content="https://serplists.com/og-default.png" data-rh="true" />

    <script>
      // Before the first paint: the same key and values as src/lib/theme.ts, light unless
      // 'dark' is stored. The boot splash below follows the class
      // (tests/unit/boot/bootSplashTheme.test.ts).
      (function () {
        try {
          var storedTheme = window.localStorage.getItem('serplists-theme');
          if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_error) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        color: #111827;
        background: #ffffff;
      }
      #boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid rgba(17, 24, 39, 0.18);
        border-top-color: rgba(17, 24, 39, 0.75);
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      /* The dark theme's --background and --foreground (src/index.css .dark), as hex: the
         app stylesheet and its variables may not have loaded yet. Keyed on the class the
         script above sets, never on the OS color setting: the app has no system theme. */
      html.dark {
        color-scheme: dark;
        background: #030303;
      }
      html.dark #boot-splash {
        color: #fafafa;
        background: #030303;
      }
      html.dark #boot-spinner {
        border-color: rgba(250, 250, 250, 0.18);
        border-top-color: rgba(250, 250, 250, 0.75);
      }
    </style>
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PZZFQBGG"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div id="boot-splash-inner">
          <div id="boot-spinner" aria-hidden="true"></div>
          <div id="boot-text">Loading SERP Lists…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
