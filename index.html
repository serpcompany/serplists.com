<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SERP Lists</title>
    <meta name="description" content="Create and run checklists for your processes." />

    <meta property="og:title" content="SERP Lists" />
    <meta property="og:description" content="Create and run checklists for your processes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/placeholder.svg" />

    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        color: #111827;
        background: #ffffff;
      }
      #boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid rgba(17, 24, 39, 0.18);
        border-top-color: rgba(17, 24, 39, 0.75);
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      @media (prefers-color-scheme: dark) {
        #boot-splash {
          color: #f9fafb;
          background: #0b1220;
        }
        #boot-spinner {
          border-color: rgba(249, 250, 251, 0.18);
          border-top-color: rgba(249, 250, 251, 0.75);
        }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div id="boot-splash" role="status" aria-live="polite">
        <div id="boot-splash-inner">
          <div id="boot-spinner" aria-hidden="true"></div>
          <div id="boot-text">Loading SERP Lists…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
