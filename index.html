    <!-- Google Tag Manager -->
    <script>
      (function (win, doc) {
        // Tags in the container read location.href, so a document whose URL carries a
        // share or invite token, a reset token or an email address never loads it. Keep
        // in step with src/lib/analyticsUrl.ts (tests/unit/security/gtmBootstrap.test.ts).
        function isSensitiveLocation(pathname, search) {
          var path = pathname;
          try {
            path = decodeURIComponent(pathname);
          } catch (_error) {
            path = pathname;
          }
          path = path.replace(/^\/+/, '/');
          if (/^\/(share|team-invites|reset-password)(\/|$)/i.test(path)) return true;
          var sensitiveKeys = ['token', 'email', 'code', 'state'];
          var sensitive = false;
          new URLSearchParams(search).forEach(function (_value, key) {
            if (sensitiveKeys.indexOf(key.toLowerCase()) !== -1) sensitive = true;
          });
          return sensitive;
        }

        var skipTagManager = true;
        try {
          skipTagManager = isSensitiveLocation(win.location.pathname, win.location.search);
        } catch (_error) {
          skipTagManager = true;
        }
        if (skipTagManager) return;

        (function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
        new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
        j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
        'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
        })(win,doc,'script','dataLayer','GTM-PZZFQBGG');
      })(window, document);
    </script>
    <!-- End Google Tag Manager -->
    <title>SERP Lists</title>

    <meta property="og:title" content="SERP Lists" />

    <meta property="og:image" content="/placeholder.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/placeholder.svg" />

    <script>
      (function () {
        try {
          var storedTheme = window.localStorage.getItem('serplists-theme');
          if (storedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_error) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <style>
      #boot-splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji",
          "Segoe UI Emoji";
        color: #111827;
        background: #ffffff;
      }
      #boot-splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      #boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid rgba(17, 24, 39, 0.18);
        border-top-color: rgba(17, 24, 39, 0.75);
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-text {
        font-size: 14px;
        letter-spacing: 0.2px;
      }
    </style>
  </head>

          <div id="boot-text">Loading SERP Lists…</div>
