name = "serp-checklists"
main = ".open-next/worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[observability]
enabled = true

[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists"

[[env.preview.services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists-preview"

[[env.production.services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists-production"

[vars]
AUTH_EMAIL_VERIFICATION_REQUIRED = "false"

[env.preview]
workers_dev = true

[env.preview.vars]
SITE_ENV = "staging"
AUTH_EMAIL_VERIFICATION_REQUIRED = "false"
PERSONAL_RUN_MCP_ENABLED = "true"
CORS_ALLOWED_ORIGINS = "https://staging.serplists.com,https://serp-checklists-preview.serpcompany.workers.dev"

[[env.preview.routes]]
pattern = "staging.serplists.com/*"
zone_name = "serplists.com"

[env.production]
workers_dev = true

[env.production.vars]
SITE_ENV = "production"
AUTH_EMAIL_VERIFICATION_REQUIRED = "true"
PERSONAL_RUN_MCP_ENABLED = "true"
CORS_ALLOWED_ORIGINS = "https://serplists.com"

[[env.production.routes]]
pattern = "serplists.com/*"
zone_name = "serplists.com"

[[env.production.routes]]
pattern = "www.serplists.com/*"
zone_name = "serplists.com"

[[d1_databases]]
binding = "DB"
database_name = "serp-checklists-db"
database_id = "b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"
preview_database_id = "fcaf4325-5be7-4ead-ab60-45932a04177b"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "serp-checklists-staging-db"
database_id = "fcaf4325-5be7-4ead-ab60-45932a04177b"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"

[[env.production.d1_databases]]
binding = "DB"
database_name = "serp-checklists-db"
database_id = "b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"

[[env.preview.r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"

[[env.production.r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"
