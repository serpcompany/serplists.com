# The Worker that serves the Next.js app (pages and the API) through OpenNext. The top level
# is local development; `preview` (staging) and `production` are deployed environments, and
# bindings are not inherited, so each environment repeats them. See
# docs/exec-plans/active/nextjs-migration.md.
name = "serp-checklists"
main = ".open-next/worker.js"
compatibility_date = "2026-09-28"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
directory = ".open-next/assets"

[observability]
enabled = true

# OpenNext calls its own Worker for cache revalidation.
[[services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists"

[[env.preview.services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists-preview"

[[env.production.services]]
binding = "WORKER_SELF_REFERENCE"
service = "serp-checklists-production"

[vars]
AUTH_EMAIL_VERIFICATION_REQUIRED = "false"

[env.preview.vars]
AUTH_EMAIL_VERIFICATION_REQUIRED = "false"
PERSONAL_RUN_MCP_ENABLED = "true"
CORS_ALLOWED_ORIGINS = "https://staging.serplists.com,https://staging.serp-checklists.pages.dev"

[env.production.vars]
AUTH_EMAIL_VERIFICATION_REQUIRED = "true"
PERSONAL_RUN_MCP_ENABLED = "false"
CORS_ALLOWED_ORIGINS = "https://serplists.com"

# Local development and production D1 binding. Preview deployments must not use
# this database. After creating the staging D1 database, paste its UUID into
# `preview_database_id` below before enabling preview deployments.
[[d1_databases]]
binding = "DB"
database_name = "serp-checklists-db"
database_id = "b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"
preview_database_id = "fcaf4325-5be7-4ead-ab60-45932a04177b"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "serp-checklists-staging-db"
database_id = "fcaf4325-5be7-4ead-ab60-45932a04177b"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"

[[env.production.d1_databases]]
binding = "DB"
database_name = "serp-checklists-db"
database_id = "b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1"
migrations_table = "d1_migrations"
migrations_dir = "db/migrations"

# R2 bucket binding (create bucket + set name to match)
[[r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"

[[env.preview.r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"

[[env.production.r2_buckets]]
binding = "R2_UPLOADS"
bucket_name = "serp-checklists-uploads"

# Secrets are set per Worker: `wrangler secret put <NAME> --env <preview|production>`.
