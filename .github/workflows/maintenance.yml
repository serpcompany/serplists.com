name: Weekly maintenance

on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [all, doc-gardening, code-gardening, report]
        default: all

concurrency:
  group: weekly-maintenance
  cancel-in-progress: false

jobs:
  doc-gardening:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'doc-gardening'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
      COREPACK_ENABLE_AUTO_PIN: "0"
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      LEFTHOOK: "0"
    steps:
      - name: Skip this week unless there's room for a gardening pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so the docs aren't gardened (docs/agents/ci-agents.md, Weekly maintenance)."
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("chore/doc-gardening-")) | .number] | first // empty')
          if [ -n "$open" ]; then
            echo "::notice::Doc gardening pull request #$open is still open, so doc gardening skips this week."
            exit 0
          fi
          echo "GARDEN=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: env.GARDEN == 'true'
        with:
          ref: staging
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: env.GARDEN == 'true'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: env.GARDEN == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: env.GARDEN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the maintenance report
        if: env.GARDEN == 'true'
        run: mkdir -p tmp && pnpm run --silent maintenance:report > tmp/maintenance-report.md

      - name: Note when doc gardening starts
        if: env.GARDEN == 'true'
        run: echo "GARDENING_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Garden the docs with Claude
        id: garden
        if: env.GARDEN == 'true'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "900000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution": {"commit": "", "pr": ""}}'
          prompt: |
            You are this repository's weekly doc gardener. Follow AGENTS.md and docs/agents/code.md.
            Goal: docs and quality grades that no longer match the code are fixed in one small pull
            request into staging.

            1. Read tmp/maintenance-report.md. Your work list is the "Checks" failures that are
               about docs, the "Docs to re-verify" list, and the rows under "Scores to re-grade".
               Handle at most 8 docs, starting with the ones whose named files changed most.
            2. For each doc, read it and the code it names. Fix what is no longer true and remove
               what no longer exists. Keep the doc's structure and its plain, short sentences. If a
               doc is still accurate, change nothing in it.
            3. Re-grade each row listed under "Scores to re-grade" in docs/quality.md. Read the code
               in its Code column, with its tests, CI, and docs, and grade it again on the scale at
               the top of docs/quality.md. Rewrite the row to match the code as it is now, and link
               each gap to its issue or to the row of docs/tech-debt.md or docs/harness-debt.md
               that covers it (add a row, with a Size, when none does). Set the row's Graded date to
               today (UTC), even when its grade stays the same. Change no other row. Remove rows of
               either debt file whose debt the code has paid off.
            4. Edit only Markdown: AGENTS.md, ARCHITECTURE.md, CONTEXT.md, README.md, docs/ except
               docs/adr/ (ADRs record decisions; never rewrite them), docs/api/ (written from code)
               and docs/references/ (third-party docs), and .claude/skills/. Never touch code,
               tests, workflows, or anything a tool generates.
            5. Run `pnpm run verify docs`; it must pass.
            6. If you changed nothing, stop and say "No doc drift found". Otherwise create the branch
               chore/doc-gardening-<YYYY-MM-DD> from the current HEAD, commit with
               `git commit -m "docs: weekly doc gardening"` and nothing else in the message, push
               it, and open one pull request into staging titled
               "docs: weekly doc gardening (<YYYY-MM-DD>)". Write its body to tmp/pr-body.md first
               and pass it with `--body-file tmp/pr-body.md`. Start the body with the line
               "No issue: weekly doc gardening from the maintenance report.", then list each doc you
               changed, what was wrong, and the code you checked it against; each row you
               re-graded, with its old and new grade and why; then the docs you checked without
               changes.
            7. This repository's commits and pull requests carry no attribution: no Co-Authored-By
               trailer in the commit, and no "Generated with Claude Code" line in the body.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --strict-mcp-config
            --settings '{"disableAllHooks":true}'
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(pnpm run verify docs:*),Bash(date:*)"

      - name: Keep the doc gardening transcript
        if: always() && env.GARDEN == 'true' && steps.garden.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: doc-gardening-transcript
          path: ${{ steps.garden.outputs.execution_file }}
          retention-days: 7
          overwrite: true

      - name: Fail unless doc gardening opened one pull request or found no drift
        if: ${{ !cancelled() && steps.garden.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.garden.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.garden.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_PREFIX: chore/doc-gardening-
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const clean = (value, max = 120) => String(value).replace(/[\r\n%]+/g, ' ').slice(0, max)
          const fail = message => {
            console.log(`::error title=Doc gardening didn't finish::${clean(message, 900)}`)
            process.exit(1)
          }
          const tokenAdvice = result => result.api_error_status === 401 ? " The API refused the token (401), so renew the CLAUDE_CODE_OAUTH_TOKEN secret (docs/agents/ci-agents.md, Claude's app and token)." : ''
          const readResult = () => {
            const file = process.env.EXECUTION_FILE
            if (!file || !fs.existsSync(file)) {
              if (process.env.CLAUDE_OUTCOME === 'failure') fail("The Claude step failed before Claude ran, so it wrote no execution log: that step's own log says why.")
              fail('Doc gardening wrote no execution log.')
            }
            let messages
            try {
              messages = JSON.parse(fs.readFileSync(file, 'utf8'))
            } catch (error) {
              fail(`The execution log isn't JSON: ${error.message}`)
            }
            if (!Array.isArray(messages)) fail("The execution log isn't a list of messages.")
            const result = messages.filter(entry => entry?.type === 'result').at(-1)
            if (!result) fail('The execution log has no result.')
            return { messages, result }
          }
          const get = async route => {
            const api = `${process.env.GITHUB_API_URL || 'https://api.github.com'}/repos/${process.env.GITHUB_REPOSITORY}`
            const response = await fetch(`${api}${route}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            })
            if (!response.ok) throw new Error(`GET ${route.split('?')[0]} returned ${response.status}`)
            return response.json()
          }
          const attribution = /co-authored-by:|generated with \[?claude code/i
          const main = async () => {
            const { messages, result } = readResult()
            const said = String(result.result || '')
            console.log(`Doc gardening: ${result.num_turns} turns, about $${Number(result.total_cost_usd || 0).toFixed(2)}. Claude said: ${clean(said || '(nothing)', 400)}`)
            if (result.is_error) fail(`Doc gardening ended in an error: ${clean(said || result.subtype || 'no message', 400)}${tokenAdvice(result)}`)
            const sets = messages.filter(entry => entry?.type === 'system' && entry.subtype === 'background_tasks_changed')
            const running = (sets.at(-1)?.tasks || []).filter(task => task && !task.ambient)
            if (running.length) fail(`Doc gardening ended with ${running.length} background task(s) still running.`)
            const denied = [...new Set((result.permission_denials || []).map(denial =>
              denial?.tool_input?.command ? `${denial.tool_name} (${clean(denial.tool_input.command)})` : String(denial?.tool_name)
            ))]
            const startedAt = Date.parse(process.env.GARDENING_STARTED_AT || '')
            if (Number.isNaN(startedAt)) fail("GARDENING_STARTED_AT isn't set, so the check can't tell whether this run opened a pull request.")
            let opened
            try {
              opened = (await get('/pulls?state=open&base=staging&per_page=100')).filter(pr => String(pr?.head?.ref).startsWith(process.env.BRANCH_PREFIX) && Date.parse(pr.created_at) >= startedAt - 30 * 1000)
            } catch (error) {
              fail(`Couldn't list the open pull requests to check the outcome: ${error.message}`)
            }
            if (opened.length > 1) fail(`Doc gardening opened ${opened.map(pr => `#${pr.number}`).join(', ')}; it opens one pull request each week.`)
            let outcome = null
            if (opened.length === 1) {
              const pr = opened[0]
              let commits
              try {
                commits = await get(`/pulls/${pr.number}/commits?per_page=100`)
              } catch (error) {
                fail(`Couldn't read the commits of #${pr.number}: ${error.message}`)
              }
              const marked = [
                ...(attribution.test(String(pr.body || '')) ? ['the body'] : []),
                ...commits.filter(item => attribution.test(String(item?.commit?.message || ''))).map(item => `commit ${String(item.sha).slice(0, 7)}`)
              ]
              if (marked.length > 0) fail(`Doc gardening opened #${pr.number}, but ${marked.join(' and ')} carry attribution. This repository's commits and pull requests carry no Co-Authored-By trailer and no "Generated with Claude Code" line.`)
              outcome = `opened #${pr.number}`
            } else if (/No doc drift found/i.test(said)) outcome = 'found no doc drift'
            if (!outcome) {
              const reason = denied.length > 0 ? ` Claude was denied ${denied.join(', ')}; allow it in claude_args.` : ''
              fail(`Doc gardening finished without opening a pull request or reporting "No doc drift found".${reason} Claude said: ${clean(said || '(nothing)', 400)}`)
            }
            if (denied.length > 0) {
              console.log(`::warning title=Doc gardening was denied tools::Claude was denied ${clean(denied.join(', '), 600)} but still ${outcome}. Allow it in claude_args if the job needs it.`)
            }
            console.log(`Doc gardening ${outcome}.`)
          }
          main().catch(error => fail(`The doc gardening check failed: ${error?.message}`))

  code-gardening:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'code-gardening'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: read
      id-token: write
    env:
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
      COREPACK_ENABLE_AUTO_PIN: "0"
      HAS_CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      LEFTHOOK: "0"
    steps:
      - name: Skip this week unless there's room for a gardening pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_CLAUDE_TOKEN" != "true" ]; then
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN isn't set, so no code is gardened (docs/agents/ci-agents.md, Weekly maintenance)."
            exit 0
          fi
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --base staging --state open --limit 100 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("chore/code-gardening-")) | .number] | first // empty')
          if [ -n "$open" ]; then
            echo "::notice::Code gardening pull request #$open is still open, so code gardening skips this week."
            exit 0
          fi
          echo "GARDEN=true" >> "$GITHUB_ENV"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        if: env.GARDEN == 'true'
        with:
          ref: staging
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        if: env.GARDEN == 'true'
        with:
          package_json_file: package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        if: env.GARDEN == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        if: env.GARDEN == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build the maintenance report
        if: env.GARDEN == 'true'
        run: mkdir -p tmp && pnpm run --silent maintenance:report > tmp/maintenance-report.md

      - name: Note when code gardening starts
        if: env.GARDEN == 'true'
        run: echo "GARDENING_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Garden the code with Claude
        id: garden
        if: env.GARDEN == 'true'
        uses: anthropics/claude-code-action@2dca132ff0e0c4094ce6048b422c6915a071210b
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
          BASH_DEFAULT_TIMEOUT_MS: "900000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution": {"commit": "", "pr": ""}}'
          prompt: |
            You are this repository's weekly code gardener. Follow AGENTS.md, ARCHITECTURE.md,
            docs/agents/code.md, and CONTEXT.md.
            Goal: one small piece of known debt is paid down in one small pull request into staging.

            1. Read tmp/maintenance-report.md and pick ONE item:
               a. the first row of docs/tech-debt.md, and then of docs/harness-debt.md, whose Size
                  is `small`, reading their tables from the top (the report names it under "Known
                  debt"); or, when there is none or you must pass over it,
               b. one file under "Files near the size limit" in the report, split by
                  responsibility so it stays well under the limit.
               Pass over an item that needs a migration, production or Staging data, a deploy,
               billing or Stripe, a change to the behavior or wording a product doc describes, an
               ADR-level decision, or another decision AGENTS.md leaves to a person, and take the
               next one. If nothing qualifies, stop and say "Nothing to garden".
            2. Fix that item and nothing else, the way its row says, in as few lines as it needs.
               Update the tests and docs that describe the code you change. Write no code comments.
            3. If the item is a row of a debt file, delete the row. If the fix shows debt you didn't
               fix, add a row for it, with a Size.
            4. Run `pnpm run check` and fix what it reports. If it still fails, stop and say
               "Gardening failed:" with what fails, and open no pull request.
            5. Create the branch chore/code-gardening-<YYYY-MM-DD> from the current HEAD. Commit
               with `git commit -m "<subject>"` and nothing else in the message, where the subject
               is a conventional commit subject that names the change, such as
               "refactor: split the template routes by action". Push the branch and open one pull
               request into staging with the subject as its title. Write its body to
               tmp/pr-body.md first and pass it with `--body-file tmp/pr-body.md`: start it with
               "Closes #<n>" when the row names an issue, or "No issue: <why>" when it doesn't;
               then the item and why you picked it, what you changed, and the last lines of
               `pnpm run check`.
            6. This repository's commits and pull requests carry no attribution: no Co-Authored-By
               trailer in the commit, and no "Generated with Claude Code" line in the body.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 80
            --strict-mcp-config
            --settings '{"disableAllHooks":true}'
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git:*),Bash(gh pr create:*),Bash(pnpm run check),Bash(pnpm run verify:*),Bash(pnpm exec tsc:*),Bash(pnpm exec vitest:*),Bash(date:*)"

      - name: Keep the code gardening transcript
        if: always() && env.GARDEN == 'true' && steps.garden.outputs.execution_file != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: code-gardening-transcript
          path: ${{ steps.garden.outputs.execution_file }}
          retention-days: 7
          overwrite: true

      - name: Fail unless code gardening opened one pull request or found nothing to garden
        if: ${{ !cancelled() && steps.garden.outcome != 'skipped' }}
        env:
          EXECUTION_FILE: ${{ steps.garden.outputs.execution_file }}
          CLAUDE_OUTCOME: ${{ steps.garden.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_PREFIX: chore/code-gardening-
        shell: node {0}
        run: |
          const fs = require('node:fs')
          const clean = (value, max = 120) => String(value).replace(/[\r\n%]+/g, ' ').slice(0, max)
          const fail = message => {
            console.log(`::error title=Code gardening didn't finish::${clean(message, 900)}`)
            process.exit(1)
          }
          const tokenAdvice = result => result.api_error_status === 401 ? " The API refused the token (401), so renew the CLAUDE_CODE_OAUTH_TOKEN secret (docs/agents/ci-agents.md, Claude's app and token)." : ''
          const readResult = () => {
            const file = process.env.EXECUTION_FILE
            if (!file || !fs.existsSync(file)) {
              if (process.env.CLAUDE_OUTCOME === 'failure') fail("The Claude step failed before Claude ran, so it wrote no execution log: that step's own log says why.")
              fail('Code gardening wrote no execution log.')
            }
            let messages
            try {
              messages = JSON.parse(fs.readFileSync(file, 'utf8'))
            } catch (error) {
              fail(`The execution log isn't JSON: ${error.message}`)
            }
            if (!Array.isArray(messages)) fail("The execution log isn't a list of messages.")
            const result = messages.filter(entry => entry?.type === 'result').at(-1)
            if (!result) fail('The execution log has no result.')
            return { messages, result }
          }
          const get = async route => {
            const api = `${process.env.GITHUB_API_URL || 'https://api.github.com'}/repos/${process.env.GITHUB_REPOSITORY}`
            const response = await fetch(`${api}${route}`, {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28'
              }
            })
            if (!response.ok) throw new Error(`GET ${route.split('?')[0]} returned ${response.status}`)
            return response.json()
          }
          const attribution = /co-authored-by:|generated with \[?claude code/i
          const main = async () => {
            const { messages, result } = readResult()
            const said = String(result.result || '')
            console.log(`Code gardening: ${result.num_turns} turns in ${Math.round((result.duration_ms || 0) / 1000)}s, about $${Number(result.total_cost_usd || 0).toFixed(2)}. Claude said: ${clean(said || '(nothing)', 400)}`)
            if (result.is_error) fail(`Code gardening ended in an error: ${clean(said || result.subtype || 'no message', 400)}${tokenAdvice(result)}`)
            const sets = messages.filter(entry => entry?.type === 'system' && entry.subtype === 'background_tasks_changed')
            const running = (sets.at(-1)?.tasks || []).filter(task => task && !task.ambient)
            if (running.length) fail(`Code gardening ended with ${running.length} background task(s) still running.`)
            const denied = [...new Set((result.permission_denials || []).map(denial =>
              denial?.tool_input?.command ? `${denial.tool_name} (${clean(denial.tool_input.command)})` : String(denial?.tool_name)
            ))]
            const startedAt = Date.parse(process.env.GARDENING_STARTED_AT || '')
            if (Number.isNaN(startedAt)) fail("GARDENING_STARTED_AT isn't set, so the check can't tell whether this run opened a pull request.")
            let opened
            try {
              opened = (await get('/pulls?state=open&base=staging&per_page=100')).filter(pr => String(pr?.head?.ref).startsWith(process.env.BRANCH_PREFIX) && Date.parse(pr.created_at) >= startedAt - 30 * 1000)
            } catch (error) {
              fail(`Couldn't list the open pull requests to check the outcome: ${error.message}`)
            }
            if (opened.length > 1) fail(`Code gardening opened ${opened.map(pr => `#${pr.number}`).join(', ')}; it fixes one item in one pull request each week.`)
            let outcome = null
            if (opened.length === 1) {
              const pr = opened[0]
              let commits
              try {
                commits = await get(`/pulls/${pr.number}/commits?per_page=100`)
              } catch (error) {
                fail(`Couldn't read the commits of #${pr.number}: ${error.message}`)
              }
              const marked = [
                ...(attribution.test(String(pr.body || '')) ? ['the body'] : []),
                ...commits.filter(item => attribution.test(String(item?.commit?.message || ''))).map(item => `commit ${String(item.sha).slice(0, 7)}`)
              ]
              if (marked.length > 0) fail(`Code gardening opened #${pr.number}, but ${marked.join(' and ')} carry attribution. This repository's commits and pull requests carry no Co-Authored-By trailer and no "Generated with Claude Code" line.`)
              outcome = `opened #${pr.number}: ${clean(pr.title, 200)}`
            } else if (/Nothing to garden/i.test(said)) outcome = 'found nothing to garden'
            if (!outcome) {
              const reason = denied.length > 0 ? ` Claude was denied ${denied.join(', ')}; allow it in claude_args.` : ''
              fail(`Code gardening finished without opening a pull request or reporting "Nothing to garden".${reason} Claude said: ${clean(said || '(nothing)', 400)}`)
            }
            if (denied.length > 0) {
              console.log(`::warning title=Code gardening was denied tools::Claude was denied ${clean(denied.join(', '), 600)} but still ${outcome}. Allow it in claude_args if the job needs it.`)
            }
            console.log(`Code gardening ${outcome}.`)
          }
          main().catch(error => fail(`The code gardening check failed: ${error?.message}`))

  report:
    if: github.event_name != 'workflow_dispatch' || inputs.job == 'all' || inputs.job == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read
    env:
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
      COREPACK_ENABLE_AUTO_PIN: "0"
      GH_TOKEN: ${{ github.token }}
      TITLE: Weekly repository maintenance
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: staging
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Collect the review findings of the last four weeks
        shell: bash
        run: |
          mkdir -p tmp
          since="$(date -u -d '28 days ago' +%Y-%m-%dT%H:%M:%SZ)"
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/comments?since=$since&per_page=100" \
            --jq '.[] | select((.user.login == "github-actions[bot]" or .user.login == "claude[bot]") and .in_reply_to_id == null) | {path, body, url: .html_url, pull: (.pull_request_url | split("/") | last | tonumber)}' |
            jq --slurp . >tmp/review-findings.json
          echo "Collected $(jq length tmp/review-findings.json) findings since $since."

      - name: Build the maintenance report
        run: mkdir -p tmp && pnpm run --silent maintenance:report > tmp/weekly-report.md

      - name: Open or update the maintenance issue
        run: |
          number=$(gh issue list --state open --author app/github-actions --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file tmp/weekly-report.md
            gh issue comment "$number" --body "Report refreshed on $(date -u +%F)."
          else
            gh issue create --title "$TITLE" --body-file tmp/weekly-report.md --label chore --label ready-for-agent
          fi
