name: Data migration rehearsal
on:
  workflow_dispatch:
    inputs:
      expected_commit: { required: true, description: Exact reviewed commit SHA }
      database_name: { required: true, description: New allowlisted ephemeral rehearsal database name }
      recovery_database_name: { required: true, description: New separate allowlisted ephemeral recovery database name }
      migration_from: { required: true, description: First reviewed migration; use none for an application-only release }
      migration_to: { required: true, description: Last reviewed migration; use none for an application-only release }
concurrency:
  group: data-rehearsal-${{ github.run_id }}
  cancel-in-progress: false
permissions: { contents: read }
env:
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  sanitized_source:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      DATA_PROMOTION_WORKFLOW: data-promotion
      DATA_PROTECTED_ENVIRONMENT: production
      MIGRATION_FROM: ${{ inputs.migration_from }}
      MIGRATION_TO: ${{ inputs.migration_to }}
    steps:
      - name: Reject untrusted rehearsal commit before checkout
        id: commit_gate
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: |
          set -eu
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-false}" = true
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - name: Finalize production-source pre-checkout failure
        if: always() && steps.commit_gate.outcome != 'success'
        env:
          REPORT_COMMIT: ${{ github.sha }}
          REPORT_ENVIRONMENT: production
          REPORT_DATABASE_NAME: serp-checklists-db
          REPORT_DATABASE_ID: b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1
          REPORT_MIGRATION_FROM: ${{ inputs.migration_from }}
          REPORT_MIGRATION_TO: ${{ inputs.migration_to }}
        run: |
          mkdir -p tmp/early-failure/production-source
          jq -n --arg commit "$REPORT_COMMIT" --arg environment "$REPORT_ENVIRONMENT" --arg databaseName "$REPORT_DATABASE_NAME" --arg databaseId "$REPORT_DATABASE_ID" --arg from "$REPORT_MIGRATION_FROM" --arg to "$REPORT_MIGRATION_TO" '{check:"workflow-early-failure",verdict:"fail",commit:$commit,target:{environment:$environment,databaseName:$databaseName,databaseId:$databaseId},migrationRange:{from:$from,to:$to},failedStage:"pre-checkout-commit-validation"}' > tmp/early-failure/production-source/early-failure.json
          printf 'BLOCKED %s pre-checkout-commit-validation; commit=%s; database=%s (%s); migration=%s -> %s.\n' "$REPORT_ENVIRONMENT" "$REPORT_COMMIT" "$REPORT_DATABASE_NAME" "$REPORT_DATABASE_ID" "$REPORT_MIGRATION_FROM" "$REPORT_MIGRATION_TO" > tmp/early-failure/production-source/early-failure.txt
          COMMIT_XML=$(jq -rn --arg v "$REPORT_COMMIT" '$v|@html'); ENV_XML=$(jq -rn --arg v "$REPORT_ENVIRONMENT" '$v|@html'); NAME_XML=$(jq -rn --arg v "$REPORT_DATABASE_NAME" '$v|@html'); ID_XML=$(jq -rn --arg v "$REPORT_DATABASE_ID" '$v|@html'); FROM_XML=$(jq -rn --arg v "$REPORT_MIGRATION_FROM" '$v|@html'); TO_XML=$(jq -rn --arg v "$REPORT_MIGRATION_TO" '$v|@html')
          printf '<testsuite name="workflow-early-failure" tests="1" failures="1"><properties><property name="commit" value="%s"/><property name="environment" value="%s"/><property name="databaseName" value="%s"/><property name="databaseId" value="%s"/><property name="migrationFrom" value="%s"/><property name="migrationTo" value="%s"/></properties><testcase name="pre-checkout-commit-validation"><failure message="workflow stopped before privileged execution"/></testcase></testsuite>\n' "$COMMIT_XML" "$ENV_XML" "$NAME_XML" "$ID_XML" "$FROM_XML" "$TO_XML" > tmp/early-failure/production-source/early-failure.junit.xml
      - name: Upload production-source pre-checkout failure
        if: always() && steps.commit_gate.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-source-early-failure-${{ github.run_id }}
          path: tmp/early-failure/production-source/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { ref: "${{ github.sha }}" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Protected production source export through repository sanitizer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p tmp/production-sensitive tmp/data-evidence
          trap 'rm -f tmp/production-sensitive/rehearsal-source.sql' EXIT
          node scripts/data/data-command.mjs identify --environment production --execute
          if ! pnpm exec wrangler d1 export serp-checklists-db --remote --no-schema --output tmp/production-sensitive/rehearsal-source.sql; then
            set +e
            node scripts/data/sanitize-rehearsal-export.mjs --input tmp/production-sensitive/rehearsal-source.sql --output tmp/data-evidence/production-shaped.sql --manifest tmp/data-evidence/production-shaped.manifest.json --source-database-id b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1 --source-date "$(date -u +%F)" --issue 95 --approver-identity @devinschumacher --retention-deadline "$(date -u -d '+23 hours' +%Y-%m-%dT%H:%M:%SZ)" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --report-dir tmp/data-reports/sanitizer --execute
            set -e
            exit 1
          fi
          node scripts/data/sanitize-rehearsal-export.mjs --input tmp/production-sensitive/rehearsal-source.sql --output tmp/data-evidence/production-shaped.sql --manifest tmp/data-evidence/production-shaped.manifest.json --source-database-id b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1 --source-date "$(date -u +%F)" --issue 95 --approver-identity @devinschumacher --retention-deadline "$(date -u -d '+23 hours' +%Y-%m-%dT%H:%M:%SZ)" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --report-dir tmp/data-reports/sanitizer --execute
          test ! -e tmp/production-sensitive/rehearsal-source.sql
      - name: Attest repository-sanitized production-shaped artifact
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: tmp/data-evidence/production-shaped*
      - name: Upload only sanitized rehearsal source
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitized-rehearsal-source-${{ github.run_id }}
          path: tmp/data-evidence/production-shaped*
          if-no-files-found: error
          retention-days: 1
      - name: Always upload sanitizer reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sanitizer-reports-${{ github.run_id }}
          path: tmp/data-reports/sanitizer/
          if-no-files-found: error
          retention-days: 90

  rehearsal:
    needs: sanitized_source
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      actions: read
      attestations: read
    env:
      DATA_PROMOTION_WORKFLOW: data-promotion
      DATA_PROTECTED_ENVIRONMENT: staging
      DATA_APPROVER_IDENTITY: "@devinschumacher"
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      DATABASE_NAME: ${{ inputs.database_name }}
      RECOVERY_DATABASE_NAME: ${{ inputs.recovery_database_name }}
      MIGRATION_FROM: ${{ inputs.migration_from }}
      MIGRATION_TO: ${{ inputs.migration_to }}
    steps:
      - name: Reject untrusted rehearsal commit before checkout
        id: commit_gate
        shell: bash
        run: |
          set -eu
          if ! [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_commit must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test "$GITHUB_REF" = refs/heads/main
          test "${GITHUB_REF_PROTECTED:-false}" = true
          test "$EXPECTED_COMMIT" = "$GITHUB_SHA"
      - name: Finalize rehearsal pre-checkout failure
        if: always() && steps.commit_gate.outcome != 'success'
        env:
          REPORT_COMMIT: ${{ github.sha }}
          REPORT_ENVIRONMENT: rehearsal
          REPORT_DATABASE_NAME: ${{ inputs.database_name }}
          REPORT_DATABASE_ID: ${{ inputs.database_id }}
          REPORT_MIGRATION_FROM: ${{ inputs.migration_from }}
          REPORT_MIGRATION_TO: ${{ inputs.migration_to }}
        run: |
          mkdir -p tmp/early-failure/rehearsal
          jq -n --arg commit "$REPORT_COMMIT" --arg environment "$REPORT_ENVIRONMENT" --arg databaseName "$REPORT_DATABASE_NAME" --arg databaseId "$REPORT_DATABASE_ID" --arg from "$REPORT_MIGRATION_FROM" --arg to "$REPORT_MIGRATION_TO" '{check:"workflow-early-failure",verdict:"fail",commit:$commit,target:{environment:$environment,databaseName:$databaseName,databaseId:$databaseId},migrationRange:{from:$from,to:$to},failedStage:"pre-checkout-commit-validation"}' > tmp/early-failure/rehearsal/early-failure.json
          printf 'BLOCKED %s pre-checkout-commit-validation; commit=%s; database=%s (%s); migration=%s -> %s.\n' "$REPORT_ENVIRONMENT" "$REPORT_COMMIT" "$REPORT_DATABASE_NAME" "$REPORT_DATABASE_ID" "$REPORT_MIGRATION_FROM" "$REPORT_MIGRATION_TO" > tmp/early-failure/rehearsal/early-failure.txt
          COMMIT_XML=$(jq -rn --arg v "$REPORT_COMMIT" '$v|@html'); ENV_XML=$(jq -rn --arg v "$REPORT_ENVIRONMENT" '$v|@html'); NAME_XML=$(jq -rn --arg v "$REPORT_DATABASE_NAME" '$v|@html'); ID_XML=$(jq -rn --arg v "$REPORT_DATABASE_ID" '$v|@html'); FROM_XML=$(jq -rn --arg v "$REPORT_MIGRATION_FROM" '$v|@html'); TO_XML=$(jq -rn --arg v "$REPORT_MIGRATION_TO" '$v|@html')
          printf '<testsuite name="workflow-early-failure" tests="1" failures="1"><properties><property name="commit" value="%s"/><property name="environment" value="%s"/><property name="databaseName" value="%s"/><property name="databaseId" value="%s"/><property name="migrationFrom" value="%s"/><property name="migrationTo" value="%s"/></properties><testcase name="pre-checkout-commit-validation"><failure message="workflow stopped before privileged execution"/></testcase></testsuite>\n' "$COMMIT_XML" "$ENV_XML" "$NAME_XML" "$ID_XML" "$FROM_XML" "$TO_XML" > tmp/early-failure/rehearsal/early-failure.junit.xml
      - name: Upload rehearsal pre-checkout failure
        if: always() && steps.commit_gate.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsal-early-failure-${{ github.run_id }}
          path: tmp/early-failure/rehearsal/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { ref: "${{ github.sha }}" }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: sanitized-rehearsal-source-${{ github.run_id }}
          path: tmp/data-evidence
      - name: Validate rehearsal dispatch inputs
        run: node scripts/data/validate-workflow-inputs.mjs rehearsal
      - name: Create both fresh rehearsal databases and record run-bound creation evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/data/data-command.mjs rehearsal-create --database-name "$DATABASE_NAME" --evidence tmp/data-reports/rehearsal/source-creation.json --execute
          node scripts/data/export-rehearsal-creation-env.mjs --evidence tmp/data-reports/rehearsal/source-creation.json --variable DATABASE_ID
          node scripts/data/data-command.mjs rehearsal-create --database-name "$RECOVERY_DATABASE_NAME" --evidence tmp/data-reports/rehearsal/recovery-creation.json --execute
          node scripts/data/export-rehearsal-creation-env.mjs --evidence tmp/data-reports/rehearsal/recovery-creation.json --variable RECOVERY_DATABASE_ID
      - name: Verify fresh empty rehearsal identity and build the pre-change schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/data/data-command.mjs identify --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --execute
          node scripts/data/data-command.mjs rehearsal-baseline --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --confirm-database-id "$DATABASE_ID" --approver-identity @devinschumacher --creation-evidence tmp/data-reports/rehearsal/source-creation.json --before "$MIGRATION_FROM" --execute
      - name: Verify attestation and import repository-sanitized production-shaped data into the baseline
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          gh attestation verify tmp/data-evidence/production-shaped.sql --repo "$GITHUB_REPOSITORY"
          gh attestation verify tmp/data-evidence/production-shaped.manifest.json --repo "$GITHUB_REPOSITORY"
          node scripts/data/data-command.mjs rehearsal-import --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --confirm-database-id "$DATABASE_ID" --approver-identity @devinschumacher --input tmp/data-evidence/production-shaped.sql --manifest tmp/data-evidence/production-shaped.manifest.json --execute
      - name: Capture pre-invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          INVARIANT_HMAC_KEY: ${{ secrets.STAGING_INVARIANT_HMAC_KEY }}
        run: |
          mkdir -p tmp/data-reports/rehearsal
          node scripts/data/remote-invariant-gate.mjs capture --database "$DATABASE_NAME" --database-id "$DATABASE_ID" --environment rehearsal --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --state tmp/rehearsal-pre-invariants.json --report-dir tmp/data-reports/rehearsal/remote-migration
      - name: Apply exact rehearsal migration and verify schema invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          INVARIANT_HMAC_KEY: ${{ secrets.STAGING_INVARIANT_HMAC_KEY }}
        run: |
          node scripts/data/check-reviewed-migration-range.mjs before
          node scripts/data/data-command.mjs migration-apply --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --confirm-database-id "$DATABASE_ID" --execute
          node scripts/data/check-reviewed-migration-range.mjs after
          pnpm exec tsx scripts/data/check-d1-schema.ts --database "$DATABASE_NAME" --database-id "$DATABASE_ID" --label rehearsal --report-dir tmp/data-reports/rehearsal
          node scripts/data/remote-invariant-gate.mjs compare --database "$DATABASE_NAME" --database-id "$DATABASE_ID" --environment rehearsal --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --state tmp/rehearsal-pre-invariants.json --report-dir tmp/data-reports/rehearsal/remote-migration
      - name: Restore data-bearing export into separate recovery database and verify invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          INVARIANT_HMAC_KEY: ${{ secrets.STAGING_INVARIANT_HMAC_KEY }}
        run: |
          mkdir -p tmp/rehearsal-sensitive
          trap 'rm -f tmp/rehearsal-sensitive/recovery.sql' EXIT
          node scripts/data/remote-invariant-gate.mjs capture --database "$DATABASE_NAME" --database-id "$DATABASE_ID" --environment rehearsal --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --comparison-kind recovery --state tmp/rehearsal-restored-source.json --report-dir tmp/data-reports/rehearsal/recovery
          node scripts/data/data-command.mjs identify --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --execute > tmp/data-reports/rehearsal/recovery-export-identity-before.txt
          pnpm exec wrangler d1 export "$DATABASE_NAME" --remote --output tmp/rehearsal-sensitive/recovery.sql
          node scripts/data/data-command.mjs identify --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --execute > tmp/data-reports/rehearsal/recovery-export-identity-after.txt
          node scripts/data/data-command.mjs identify --environment rehearsal --database-name "$RECOVERY_DATABASE_NAME" --database-id "$RECOVERY_DATABASE_ID" --execute
          node scripts/data/data-command.mjs recovery-restore --environment rehearsal --database-name "$RECOVERY_DATABASE_NAME" --database-id "$RECOVERY_DATABASE_ID" --confirm-database-id "$RECOVERY_DATABASE_ID" --approver-identity @devinschumacher --creation-evidence tmp/data-reports/rehearsal/recovery-creation.json --input tmp/rehearsal-sensitive/recovery.sql --execute
          node scripts/data/remote-invariant-gate.mjs compare --database "$RECOVERY_DATABASE_NAME" --database-id "$RECOVERY_DATABASE_ID" --environment rehearsal --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --comparison-kind recovery --state tmp/rehearsal-restored-source.json --report-dir tmp/data-reports/rehearsal/recovery
          rm -f tmp/rehearsal-sensitive/recovery.sql
          test ! -e tmp/rehearsal-sensitive/recovery.sql
      - name: Install Chromium for regression suite
        run: pnpm exec playwright install --with-deps chromium
      - name: Run production-shaped regression suite
        run: pnpm run test:data-regressions -- --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --sanitized tmp/data-evidence/production-shaped.sql --sanitizer-manifest tmp/data-evidence/production-shaped.manifest.json --report-dir tmp/data-reports/rehearsal/local-suite
      - name: Always teardown source rehearsal and confirm absence
        if: always()
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}" }
        run: |
          mkdir -p tmp/data-reports/rehearsal
          set +e
          node scripts/data/data-command.mjs rehearsal-teardown --environment rehearsal --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --confirm-database-id "$DATABASE_ID" --execute > tmp/data-reports/rehearsal/teardown.txt 2>&1
          DELETE_STATUS=$?
          node scripts/data/confirm-rehearsal-absent.mjs >> tmp/data-reports/rehearsal/teardown.txt 2>&1
          ABSENCE_STATUS=$?
          test "$DELETE_STATUS" -eq 0 -a "$ABSENCE_STATUS" -eq 0
      - name: Always teardown recovery rehearsal and confirm absence
        if: always()
        env: { CLOUDFLARE_API_TOKEN: "${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}" }
        run: |
          mkdir -p tmp/data-reports/rehearsal
          set +e
          node scripts/data/data-command.mjs rehearsal-teardown --environment rehearsal --database-name "$RECOVERY_DATABASE_NAME" --database-id "$RECOVERY_DATABASE_ID" --confirm-database-id "$RECOVERY_DATABASE_ID" --execute >> tmp/data-reports/rehearsal/teardown.txt 2>&1
          DELETE_STATUS=$?
          DATABASE_NAME="$RECOVERY_DATABASE_NAME" node scripts/data/confirm-rehearsal-absent.mjs >> tmp/data-reports/rehearsal/teardown.txt 2>&1
          ABSENCE_STATUS=$?
          test "$DELETE_STATUS" -eq 0 -a "$ABSENCE_STATUS" -eq 0
      - name: Finalize real recovery rehearsal evidence
        if: always()
        run: node scripts/data/finalize-recovery-rehearsal.mjs --comparison tmp/data-reports/rehearsal/recovery/remote-invariant-comparison.json --teardown tmp/data-reports/rehearsal/teardown.txt --raw tmp/rehearsal-sensitive/recovery.sql --source-database-name "$DATABASE_NAME" --source-database-id "$DATABASE_ID" --recovery-database-name "$RECOVERY_DATABASE_NAME" --recovery-database-id "$RECOVERY_DATABASE_ID" --source-creation tmp/data-reports/rehearsal/source-creation.json --recovery-creation tmp/data-reports/rehearsal/recovery-creation.json --commit "$GITHUB_SHA" --environment rehearsal --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --sanitizer-manifest tmp/data-evidence/production-shaped.manifest.json --output tmp/data-reports/rehearsal/recovery-rehearsal.json
      - name: Finalize only proven rehearsal evidence
        if: always()
        run: |
          node scripts/data/finalize-rehearsal-report.mjs --source tmp/data-reports/rehearsal/local-suite/data-regression-suite.json --comparison tmp/data-reports/rehearsal/remote-migration/remote-invariant-comparison.json --recovery tmp/data-reports/rehearsal/recovery-rehearsal.json --teardown tmp/data-reports/rehearsal/teardown.txt --sanitized tmp/data-evidence/production-shaped.sql --sanitizer-manifest tmp/data-evidence/production-shaped.manifest.json --commit "$GITHUB_SHA" --database-name "$DATABASE_NAME" --database-id "$DATABASE_ID" --recovery-database-id "$RECOVERY_DATABASE_ID" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --output tmp/data-reports/rehearsal/rehearsal-promotion.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsal-${{ github.run_id }}
          path: |
            tmp/data-reports/rehearsal/
            tests/test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 90
