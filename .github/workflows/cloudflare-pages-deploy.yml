name: Deploy to Cloudflare Pages

# Called by ci.yml after the Quality Gate and schema parity jobs pass.
# To deploy manually, run the CI workflow with "deploy" checked.
on:
  workflow_call:

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Runtime auth secrets live in Cloudflare Pages. CI only needs a valid
      # placeholder so `pnpm run typecheck:env` can validate the contract
      # without duplicating the production secret into GitHub Actions.
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
      COREPACK_ENABLE_AUTO_PIN: "0"
      # Cloudflare Pages project names are not secrets. This must be the Pages
      # Project Name, not the pages.dev domain or the wrangler.toml `name`.
      CLOUDFLARE_PAGES_PROJECT: serplists-com
      VITE_PERSONAL_RUN_MCP_ENABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: sitemap lastmod dates are derived from git log. A shallow
          # clone would stamp every static page with the deploy commit's date.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Block production deploy on pending D1 migrations
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: pnpm run verify:prod:d1

      - name: Block staging deploy on pending D1 migrations
        if: github.ref_name != 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: pnpm run verify:staging

      - name: Build site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          set -o pipefail
          npx wrangler pages deploy ./dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify the new deployment responds
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "::warning::Deployment URL not found in wrangler output; skipping post-deploy checks."
            exit 0
          fi
          # /api/health proves the Worker boots; /api/templates proves the D1 binding works.
          for path in /api/health /api/templates; do
            code=000
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "$DEPLOY_URL$path" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            if [ "$code" = "200" ]; then
              echo "$DEPLOY_URL$path -> 200"
            elif [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
              echo "::error::$DEPLOY_URL$path returned $code after deploy. Check the Pages deployment logs and bindings."
              exit 1
            else
              echo "::warning::$DEPLOY_URL$path returned $code (access policy?); could not verify."
            fi
          done
