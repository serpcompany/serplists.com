name: Deploy to Cloudflare Pages

# DISCONNECTED. The app now builds for Cloudflare Workers through OpenNext (`pnpm run
# build:worker`), so `pnpm run build` no longer produces the ./dist this workflow deploys to
# Pages. ci.yml no longer calls it, and its first step fails, so it cannot publish a broken
# Pages deployment if a caller comes back by mistake. The Workers deploy (staging, then
# production) replaces it at launch: docs/exec-plans/active/nextjs-migration.md, phase 4.
on:
  workflow_call:

concurrency:
  group: pages-deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Runtime auth secrets live in Cloudflare Pages. CI only needs a valid
      # placeholder so `pnpm run typecheck:env` can validate the contract
      # without duplicating the production secret into GitHub Actions.
      BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
      COREPACK_ENABLE_AUTO_PIN: "0"
      # Cloudflare Pages project names are not secrets. This must be the Pages
      # Project Name, not the pages.dev domain or the wrangler.toml `name`.
      CLOUDFLARE_PAGES_PROJECT: serplists-com
      VITE_PERSONAL_RUN_MCP_ENABLED: ${{ github.ref_name == 'staging' && 'true' || 'false' }}
    steps:
      - name: Refuse to deploy (disconnected)
        run: |
          echo "::error::The Pages deploy is disconnected: the app builds for Workers now (docs/exec-plans/active/nextjs-migration.md)."
          exit 1

      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: sitemap lastmod dates are derived from git log. A shallow
          # clone would stamp every static page with the deploy commit's date.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Block production deploy on pending D1 migrations
        if: github.ref_name == 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: pnpm run verify:prod:d1

      - name: Block staging deploy on pending D1 migrations
        if: github.ref_name != 'main'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: pnpm run verify:staging

      - name: Build site
        run: pnpm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
        run: |
          set -o pipefail
          npx wrangler pages deploy ./dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch "$GITHUB_REF_NAME" --commit-hash "$GITHUB_SHA" | tee deploy.log
          echo "url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Verify the new deployment responds
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        # Fails on a 5xx or no response; other statuses only warn (docs/RELIABILITY.md).
        run: node scripts/verify-deployment.mjs
