name: Protected data promotion and Pages deploy
on:
  push:
    branches: [staging]
  workflow_dispatch:
    inputs:
      expected_commit: { description: Exact reviewed main commit SHA, required: true }
      migration_from: { description: First reviewed pending migration filename; use none for an application-only release, required: true }
      migration_to: { description: Last reviewed pending migration filename; use none for an application-only release, required: true }
      migration_classification:
        description: Highest risk classification in the reviewed range; use additive with none/none
        required: true
        type: choice
        options: [additive, backfill, destructive, irreversible]
      ci_run_id: { description: Exact-commit CI data-regression artifact run, required: true }
      staging_run_id: { description: Successful staging promotion run for the exact main PR head tree, required: true }
      rehearsal_run_id: { description: Exact-commit production-shaped rehearsal artifact run, required: true }
      confirm_production_database_id: { description: Exact allowlisted production D1 UUID, required: true }
concurrency:
  group: data-promotion-${{ github.event_name == 'workflow_dispatch' && 'production' || github.ref_name }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  attestations: read
defaults:
  run:
    # Explicit Bash enables -e -o pipefail for every privileged pipeline.
    shell: bash
env:
  COREPACK_ENABLE_AUTO_PIN: "0"
  CLOUDFLARE_PAGES_PROJECT: serplists-com
  CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  staging_data:
    if: github.event_name == 'push' && github.ref_name == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    env:
      DATA_PROMOTION_WORKFLOW: data-promotion
      DATA_PROTECTED_ENVIRONMENT: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium for data regressions
        run: pnpm exec playwright install --with-deps chromium
      - name: Identity allowlist and recovery bookmark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p tmp/data-reports/staging
          node scripts/data/data-command.mjs identify --environment staging --execute > tmp/data-reports/staging/identity.txt
          node scripts/data/data-command.mjs recovery-bookmark --environment staging --execute > tmp/data-reports/staging/recovery-bookmark.txt
      - name: Resolve exact reviewed staging range
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          STAGING_BASE_SHA: ${{ github.event.before }}
        run: node scripts/data/check-staging-reviewed-range.mjs
      - name: Capture staging pre-invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          INVARIANT_HMAC_KEY: ${{ secrets.STAGING_INVARIANT_HMAC_KEY }}
        run: |
          node scripts/data/remote-invariant-gate.mjs capture --database serp-checklists-staging-db --database-id fcaf4325-5be7-4ead-ab60-45932a04177b --environment staging --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --state tmp/staging-pre-invariants.json --report-dir tmp/data-reports/staging
      - name: Run data regression prerequisite
        env:
          DATA_REGRESSION_BASE_SHA: ${{ github.event.before }}
        run: pnpm run test:data-regressions -- --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --report-dir tmp/data-reports/staging
      - name: Apply reviewed staging migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: node scripts/data/data-command.mjs migration-apply --environment staging --confirm-database-id fcaf4325-5be7-4ead-ab60-45932a04177b --execute
      - name: Verify ledger schema and invariants
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          INVARIANT_HMAC_KEY: ${{ secrets.STAGING_INVARIANT_HMAC_KEY }}
        run: |
          pnpm run db:migrations:check:staging
          pnpm run check:staging:d1-schema -- --report-dir tmp/data-reports/staging
          node scripts/data/remote-invariant-gate.mjs compare --database serp-checklists-staging-db --database-id fcaf4325-5be7-4ead-ab60-45932a04177b --environment staging --binding DB --commit "$GITHUB_SHA" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --state tmp/staging-pre-invariants.json --report-dir tmp/data-reports/staging
      - name: Upload staging data reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-data-${{ github.run_id }}
          path: |
            tmp/data-reports/staging/
            tests/test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare privacy-safe publication identity
        if: always()
        env:
          PUBLICATION_ENVIRONMENT: staging
          PUBLICATION_DATABASE_ID: fcaf4325-5be7-4ead-ab60-45932a04177b
        run: node scripts/data/prepare-publication-evidence.mjs
      - name: Retain publication identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/publication-evidence/publication.json
          if-no-files-found: error
          retention-days: 90

  staging_deploy:
    needs: staging_data
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: staging-data-${{ github.run_id }}
          path: tmp/staging-evidence/data
      - run: BETTER_AUTH_SECRET=ci-build-placeholder-secret-32-chars-minimum pnpm run build
      - name: Deploy staging after data gates
        id: staging_pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p tmp/data-reports/staging-deploy
          pnpm exec wrangler pages deploy ./dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch staging --commit-hash "$GITHUB_SHA" | tee tmp/data-reports/staging-deploy/deploy-output.txt
      - name: Record exact staging deployment result
        if: always()
        run: node scripts/data/record-deployment.mjs --environment staging --binding DB --reviewed-evidence "$(find tmp/staging-evidence/data -name staging-reviewed-range.json -print -quit)" --commit "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --database-name serp-checklists-staging-db --database-id fcaf4325-5be7-4ead-ab60-45932a04177b --outcome "${{ steps.staging_pages_deploy.outcome }}" --raw-output tmp/data-reports/staging-deploy/deploy-output.txt --report-dir tmp/data-reports/staging-deploy
      - name: Upload staging deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-deploy-${{ github.run_id }}
          path: tmp/data-reports/staging-deploy/
          if-no-files-found: error
          retention-days: 90

  staging_postdeploy:
    needs: staging_deploy
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: staging-data-${{ github.run_id }}
          path: tmp/staging-evidence/data
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: staging-deploy-${{ github.run_id }}
          path: tmp/staging-evidence/deploy
      - name: Approved authenticated account-owned designated-canary read write readback restore and custom-domain smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          DATA_CANARY_OWNER_ID: ${{ secrets.STAGING_DATA_CANARY_OWNER_ID }}
          DATA_CANARY_COOKIE: ${{ secrets.STAGING_DATA_CANARY_COOKIE }}
          DATA_CANARY_TEMPLATE_ID: ${{ vars.STAGING_DATA_CANARY_TEMPLATE_ID }}
          DATA_CANARY_RUN_ID: ${{ vars.STAGING_DATA_CANARY_RUN_ID }}
          DATA_CANARY_EVIDENCE_HMAC_KEY: ${{ secrets.STAGING_CANARY_EVIDENCE_HMAC_KEY }}
          DATA_CANARY_MUTATION_APPROVED: "true"
        run: |
          RANGE_REPORT=$(find tmp/staging-evidence/data -name staging-reviewed-range.json -print -quit)
          jq -e '.migrationRange | has("from") and has("to")' "$RANGE_REPORT" > /dev/null
          node scripts/data/deployment-smoke.mjs --environment staging --binding DB --migration-from "$(jq -r '.migrationRange.from // "none"' "$RANGE_REPORT")" --migration-to "$(jq -r '.migrationRange.to // "none"' "$RANGE_REPORT")" --database-name serp-checklists-staging-db --database-id fcaf4325-5be7-4ead-ab60-45932a04177b --deployment-url https://staging.serplists-com.pages.dev --custom-domain https://staging.serplists.com --report-dir tmp/data-reports/staging-postdeploy
      - name: Finalize exact staging promotion evidence
        if: always()
        run: |
          DATA_REPORT=$(find tmp/staging-evidence/data -name data-regression-suite.json -print -quit)
          RANGE_REPORT=$(find tmp/staging-evidence/data -name staging-reviewed-range.json -print -quit)
          SCHEMA_REPORT=$(find tmp/staging-evidence/data -name d1-schema-staging.json -print -quit)
          INVARIANT_REPORT=$(find tmp/staging-evidence/data -name remote-invariant-comparison.json -print -quit)
          DEPLOY_REPORT=$(find tmp/staging-evidence/deploy -name staging-deploy.json -print -quit)
          node scripts/data/finalize-staging-promotion.mjs --binding DB --data "$DATA_REPORT" --range "$RANGE_REPORT" --schema "$SCHEMA_REPORT" --invariants "$INVARIANT_REPORT" --deploy "$DEPLOY_REPORT" --smoke tmp/data-reports/staging-postdeploy/staging-postdeploy-smoke.json --commit "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --database-name serp-checklists-staging-db --database-id fcaf4325-5be7-4ead-ab60-45932a04177b --output tmp/data-reports/staging-postdeploy/staging-promotion.json
      - name: Upload staging postdeploy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-postdeploy-${{ github.run_id }}
          path: tmp/data-reports/staging-postdeploy/
          if-no-files-found: error
          retention-days: 90

  staging_failure_report:
    needs: [staging_data, staging_deploy, staging_postdeploy]
    if: always() && github.event_name == 'push' && github.ref_name == 'staging' && (needs.staging_data.result != 'success' || needs.staging_deploy.result != 'success' || needs.staging_postdeploy.result != 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      REPORT_COMMIT: ${{ github.sha }}
      REPORT_ENVIRONMENT: staging
      STAGING_DATA_RESULT: ${{ needs.staging_data.result }}
      STAGING_DEPLOY_RESULT: ${{ needs.staging_deploy.result }}
      STAGING_POSTDEPLOY_RESULT: ${{ needs.staging_postdeploy.result }}
    steps:
      - name: Record fail-closed staging promotion result
        run: |
          mkdir -p tmp/data-reports/staging-failure
          printf '{"verdict":"fail","commit":"%s","environment":"%s","jobs":{"data":"%s","deploy":"%s","postdeploy":"%s"}}\n' "$REPORT_COMMIT" "$REPORT_ENVIRONMENT" "$STAGING_DATA_RESULT" "$STAGING_DEPLOY_RESULT" "$STAGING_POSTDEPLOY_RESULT" > tmp/data-reports/staging-failure/staging-failure.json
          printf 'BLOCKED staging promotion for commit %s in environment %s. Results: data=%s deploy=%s postdeploy=%s.\n' "$REPORT_COMMIT" "$REPORT_ENVIRONMENT" "$STAGING_DATA_RESULT" "$STAGING_DEPLOY_RESULT" "$STAGING_POSTDEPLOY_RESULT" > tmp/data-reports/staging-failure/staging-failure.txt
          printf '<testsuite name="staging-promotion" tests="1" failures="1"><properties><property name="commit" value="%s"/><property name="environment" value="%s"/></properties><testcase name="promotion"><failure message="data=%s deploy=%s postdeploy=%s"/></testcase></testsuite>\n' "$REPORT_COMMIT" "$REPORT_ENVIRONMENT" "$STAGING_DATA_RESULT" "$STAGING_DEPLOY_RESULT" "$STAGING_POSTDEPLOY_RESULT" > tmp/data-reports/staging-failure/staging-failure.junit.xml
      - name: Upload staging failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: staging-failure-${{ github.run_id }}
          path: tmp/data-reports/staging-failure/
          if-no-files-found: error
          retention-days: 90
      - name: Fail the promotion after preserving reports
        run: exit 1

  production_request:
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      MIGRATION_FROM: ${{ inputs.migration_from }}
      MIGRATION_TO: ${{ inputs.migration_to }}
      MIGRATION_CLASSIFICATION: ${{ inputs.migration_classification }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      STAGING_RUN_ID: ${{ inputs.staging_run_id }}
      REHEARSAL_RUN_ID: ${{ inputs.rehearsal_run_id }}
      CONFIRM_PRODUCTION_DATABASE_ID: ${{ inputs.confirm_production_database_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version }
      - name: Validate production dispatch inputs
        id: production_input_gate
        run: node scripts/data/validate-workflow-inputs.mjs production
      - name: Finalize production-request input failure
        if: always() && steps.production_input_gate.outcome != 'success'
        env:
          REPORT_COMMIT: ${{ github.sha }}
          REPORT_ENVIRONMENT: production
          REPORT_DATABASE_NAME: serp-checklists-db
          REPORT_DATABASE_ID: ${{ inputs.confirm_production_database_id }}
          REPORT_MIGRATION_FROM: ${{ inputs.migration_from }}
          REPORT_MIGRATION_TO: ${{ inputs.migration_to }}
        run: |
          mkdir -p tmp/data-reports/production-request
          jq -n --arg commit "$REPORT_COMMIT" --arg environment "$REPORT_ENVIRONMENT" --arg databaseName "$REPORT_DATABASE_NAME" --arg databaseId "$REPORT_DATABASE_ID" --arg from "$REPORT_MIGRATION_FROM" --arg to "$REPORT_MIGRATION_TO" '{check:"workflow-early-failure",verdict:"fail",commit:$commit,target:{environment:$environment,databaseName:$databaseName,databaseId:$databaseId},migrationRange:{from:$from,to:$to},failedStage:"production-request-input-validation"}' > tmp/data-reports/production-request/early-failure.json
          printf 'BLOCKED %s production-request-input-validation; commit=%s; database=%s (%s); migration=%s -> %s.\n' "$REPORT_ENVIRONMENT" "$REPORT_COMMIT" "$REPORT_DATABASE_NAME" "$REPORT_DATABASE_ID" "$REPORT_MIGRATION_FROM" "$REPORT_MIGRATION_TO" > tmp/data-reports/production-request/early-failure.txt
          COMMIT_XML=$(jq -rn --arg v "$REPORT_COMMIT" '$v|@html'); ENV_XML=$(jq -rn --arg v "$REPORT_ENVIRONMENT" '$v|@html'); NAME_XML=$(jq -rn --arg v "$REPORT_DATABASE_NAME" '$v|@html'); ID_XML=$(jq -rn --arg v "$REPORT_DATABASE_ID" '$v|@html'); FROM_XML=$(jq -rn --arg v "$REPORT_MIGRATION_FROM" '$v|@html'); TO_XML=$(jq -rn --arg v "$REPORT_MIGRATION_TO" '$v|@html')
          printf '<testsuite name="workflow-early-failure" tests="1" failures="1"><properties><property name="commit" value="%s"/><property name="environment" value="%s"/><property name="databaseName" value="%s"/><property name="databaseId" value="%s"/><property name="migrationFrom" value="%s"/><property name="migrationTo" value="%s"/></properties><testcase name="production-request-input-validation"><failure message="workflow stopped before evidence download"/></testcase></testsuite>\n' "$COMMIT_XML" "$ENV_XML" "$NAME_XML" "$ID_XML" "$FROM_XML" "$TO_XML" > tmp/data-reports/production-request/early-failure.junit.xml
      - name: Download exact-commit CI and rehearsal artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > tmp-ci-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGING_RUN_ID" > tmp-staging-run.json
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL_RUN_ID" > tmp-rehearsal-run.json
          node scripts/data/verify-github-run-evidence.mjs --metadata tmp-ci-run.json --commit "$EXPECTED_COMMIT" --workflow CI --event push --branch main --path .github/workflows/ci.yml
          node scripts/data/verify-github-run-evidence.mjs --metadata tmp-staging-run.json --workflow "Protected data promotion and Pages deploy" --event push --branch staging --path .github/workflows/cloudflare-pages-deploy.yml
          node scripts/data/verify-github-run-evidence.mjs --metadata tmp-rehearsal-run.json --commit "$EXPECTED_COMMIT" --workflow "Data migration rehearsal" --event workflow_dispatch --branch main --path .github/workflows/data-migration-rehearsal.yml
          gh run download "$CI_RUN_ID" --dir tmp/evidence/ci
          gh run download "$STAGING_RUN_ID" --dir tmp/evidence/staging
          gh run download "$REHEARSAL_RUN_ID" --dir tmp/evidence/rehearsal
      - name: Capture exact merged-PR and change-author provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_COMMIT/pulls" > tmp/change-pulls.json
          PR_NUMBER=$(jq -er --arg sha "$EXPECTED_COMMIT" '[.[] | select(.merged_at != null and .base.ref == "main" and .merge_commit_sha == $sha)] | if length == 1 then .[0].number else error("missing or ambiguous merged PR") end' tmp/change-pulls.json)
          gh api "repos/$GITHUB_REPOSITORY/commits/$EXPECTED_COMMIT" > tmp/change-merge-commit.json
          gh api graphql -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F oid="$EXPECTED_COMMIT" -f query='query($owner:String!,$name:String!,$oid:GitObjectID!){repository(owner:$owner,name:$name){object(oid:$oid){... on Commit{oid authors(first:100){nodes{user{login}} pageInfo{hasNextPage}}}}}}' > tmp/change-merge-authors.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits?per_page=100" > tmp/change-commits.json
          gh api graphql --paginate --slurp -F owner="${GITHUB_REPOSITORY%%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" -f query='query($owner:String!,$name:String!,$number:Int!,$endCursor:String){repository(owner:$owner,name:$name){pullRequest(number:$number){commits(first:100,after:$endCursor){nodes{commit{oid authors(first:100){nodes{user{login}} pageInfo{hasNextPage}}}} pageInfo{hasNextPage endCursor}}}}}' > tmp/change-commit-authors.json
          node scripts/data/capture-change-provenance.mjs --pulls tmp/change-pulls.json --commits tmp/change-commits.json --commit-authors tmp/change-commit-authors.json --merge-commit tmp/change-merge-commit.json --merge-authors tmp/change-merge-authors.json --commit "$EXPECTED_COMMIT" --output tmp/change-provenance.json
      - name: Validate approved commit migration range and rehearsal artifact
        run: |
          CI_REPORT=$(node scripts/data/select-range-evidence.mjs tmp/evidence/ci "$MIGRATION_FROM" "$MIGRATION_TO")
          CORRECTION_REPORT=$(find tmp/evidence/ci -name contract-correction.json -print -quit)
          SCHEMA_REPORT=$(find tmp/evidence/ci -name schema-contract.json -print -quit)
          STAGING_REPORT=$(find tmp/evidence/staging -name staging-promotion.json -print)
          STAGING_REPORT_COUNT=$(printf '%s\n' "$STAGING_REPORT" | sed '/^$/d' | wc -l | tr -d ' ')
          test "$STAGING_REPORT_COUNT" -eq 1
          REHEARSAL_REPORT=$(find tmp/evidence/rehearsal -name rehearsal-promotion.json -print)
          REHEARSAL_REPORT_COUNT=$(printf '%s\n' "$REHEARSAL_REPORT" | sed '/^$/d' | wc -l | tr -d ' ')
          test "$REHEARSAL_REPORT_COUNT" -eq 1
          node scripts/data/production-request.mjs --commit "$EXPECTED_COMMIT" --classification "$MIGRATION_CLASSIFICATION" --migration-from "$MIGRATION_FROM" --migration-to "$MIGRATION_TO" --database-name serp-checklists-db --database-id "$CONFIRM_PRODUCTION_DATABASE_ID" --ci-report "$CI_REPORT" --correction-report "$CORRECTION_REPORT" --schema-report "$SCHEMA_REPORT" --staging-report "$STAGING_REPORT" --rehearsal-report "$REHEARSAL_REPORT" --ci-run-metadata tmp-ci-run.json --staging-run-metadata tmp-staging-run.json --merge-commit tmp/change-merge-commit.json --change-provenance tmp/change-provenance.json --output tmp/production-request.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: production-request-${{ github.run_id }}
          path: |
            tmp/production-request.json
            tmp/change-provenance.json
            tmp/data-reports/production-request/
          if-no-files-found: error
          retention-days: 90

      - name: Prepare privacy-safe publication identity
        if: always()
        env:
          PUBLICATION_ENVIRONMENT: production
          PUBLICATION_DATABASE_ID: b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1
          PUBLICATION_MIGRATION_FROM: ${{ inputs.migration_from }}
          PUBLICATION_MIGRATION_TO: ${{ inputs.migration_to }}
        run: node scripts/data/prepare-publication-evidence.mjs
      - name: Retain publication identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/publication-evidence/publication.json
          if-no-files-found: error
          retention-days: 90

  # Read-only token only. This environment never releases the production writer.
  # The external protection/credential-isolation hold remains binding.
  production_preparation:
    needs: production_request
    runs-on: ubuntu-latest
    environment: production-preparation
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      preparation_digest: ${{ steps.prepare.outputs.preparation_digest }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-request-${{ github.run_id }}
          path: tmp
      - name: Prepare exact production recovery with read-only credential
        id: prepare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_READONLY_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          PRODUCTION_INVARIANT_HMAC_KEY: ${{ secrets.PRODUCTION_INVARIANT_HMAC_KEY }}
          PRODUCTION_CANARY_EVIDENCE_HMAC_KEY: ${{ secrets.PRODUCTION_CANARY_EVIDENCE_HMAC_KEY }}
          DATA_PROTECTED_ENVIRONMENT: production-preparation
        run: node scripts/data/production-executor.mjs prepare --request tmp/production-request.json --output tmp/recovery/production-preparation.json --report-dir tmp/recovery
      - name: Persist encrypted recovery and exact request before approval
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/recovery/
            tmp/production-request.json
          if-no-files-found: error
          retention-days: 90
      - name: Download immutable recovery artifact for verification
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: tmp/verified-recovery
      - name: Verify durable request and encrypted export before requesting approval
        env:
          RECOVERY_ID: ${{ steps.upload.outputs.artifact-id }}
          RECOVERY_DIGEST: ${{ steps.prepare.outputs.preparation_digest }}
        run: node scripts/data/verify-production-preparation.mjs --request tmp/verified-recovery/production-request.json --preparation tmp/verified-recovery/recovery/production-preparation.json --encrypted-export "tmp/verified-recovery/recovery/production-recovery-$GITHUB_SHA.sql.enc" --preparation-digest "$RECOVERY_DIGEST" --artifact-id "$RECOVERY_ID" --output tmp/recovery-receipt.json
      - name: Always remove plaintext recovery material
        if: always()
        run: rm -f tmp/production-sensitive/*.sql

      - name: Retain preparation and durable verification outcomes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-preparation-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/recovery/*.json
            tmp/recovery/*.xml
            tmp/recovery/*.txt
            tmp/recovery-verification/
          if-no-files-found: error
          retention-days: 90

  production_owner_approval:
    needs: production_preparation
    if: github.event_name == 'workflow_dispatch' && inputs.migration_classification == 'irreversible'
    runs-on: ubuntu-latest
    environment: production-owner-approval
    steps:
      - name: Record separate irreversible repository-owner environment gate
        run: echo "Repository-owner production approval gate passed."

  production_data:
    needs: [production_preparation, production_owner_approval]
    if: always() && needs.production_preparation.result == 'success' && (inputs.migration_classification != 'irreversible' || needs.production_owner_approval.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      REQUEST_CLASSIFICATION: ${{ inputs.migration_classification }}
      REPOSITORY_OWNER_APPROVER: ${{ vars.PRODUCTION_REPOSITORY_OWNER_APPROVER }}
      RECOVERY_ID: ${{ needs.production_preparation.outputs.artifact_id }}
      RECOVERY_DIGEST: ${{ needs.production_preparation.outputs.preparation_digest }}
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - name: Validate production dispatch inputs and approval classification
        run: node scripts/data/validate-workflow-inputs.mjs approval
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-request-${{ github.run_id }}
          path: tmp
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          artifact-ids: ${{ needs.production_preparation.outputs.artifact_id }}
          path: tmp/verified-recovery
      - name: Reverify exact durable artifacts released by preparation
        run: |
          cmp tmp/production-request.json tmp/verified-recovery/production-request.json
          node scripts/data/verify-production-preparation.mjs --request tmp/production-request.json --preparation tmp/verified-recovery/recovery/production-preparation.json --encrypted-export "tmp/verified-recovery/recovery/production-recovery-$GITHUB_SHA.sql.enc" --preparation-digest "$RECOVERY_DIGEST" --artifact-id "$RECOVERY_ID" --output tmp/recovery-receipt.json
      - name: Capture independent protected-environment approval identity and decision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" > tmp/production-approvals.json
          if [ "$REQUEST_CLASSIFICATION" = irreversible ]; then
            gh api "repos/$GITHUB_REPOSITORY/collaborators/$REPOSITORY_OWNER_APPROVER/permission" > tmp/repository-owner-permission.json
          fi
          node scripts/data/capture-production-approval.mjs --reviews tmp/production-approvals.json --provenance tmp/change-provenance.json --owner-permission tmp/repository-owner-permission.json --recovery-receipt tmp/recovery-receipt.json --output tmp/production-approval.json
      - name: Protected identity recovery export reviewed migration ledger schema invariant executor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          PRODUCTION_BACKUP_ENCRYPTION_KEY: ${{ secrets.PRODUCTION_BACKUP_ENCRYPTION_KEY }}
          PRODUCTION_INVARIANT_HMAC_KEY: ${{ secrets.PRODUCTION_INVARIANT_HMAC_KEY }}
          PRODUCTION_CANARY_EVIDENCE_HMAC_KEY: ${{ secrets.PRODUCTION_CANARY_EVIDENCE_HMAC_KEY }}
          DATA_PROTECTED_ENVIRONMENT: production
        run: node scripts/data/production-executor.mjs data --request tmp/production-request.json --approval tmp/production-approval.json --preparation tmp/verified-recovery/recovery/production-preparation.json --encrypted-export "tmp/verified-recovery/recovery/production-recovery-$GITHUB_SHA.sql.enc" --preparation-digest "$RECOVERY_DIGEST" --artifact-id "$RECOVERY_ID" --output tmp/production-data-evidence.json --report-dir tmp/data-reports/production
      - name: Attest GitHub-produced production data evidence
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: tmp/production-data-evidence.json
      - name: Always remove plaintext recovery material
        if: always()
        run: rm -f tmp/production-sensitive/*.sql
      - name: Upload production data reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-data-${{ github.run_id }}
          path: |
            tmp/production-data-evidence.json
            tmp/production-approval.json
            tmp/data-reports/production/*.json
            tmp/data-reports/production/*.xml
            tmp/data-reports/production/*.txt
            tmp/data-reports/production/*.enc
          if-no-files-found: error
          retention-days: 90

  production_deploy:
    needs: production_data
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-request-${{ github.run_id }}
          path: tmp
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-data-${{ github.run_id }}
          path: tmp
      - name: Verify signed non-forgeable data evidence before deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_PROTECTED_ENVIRONMENT: production
        run: |
          gh attestation verify tmp/production-data-evidence.json --repo "$GITHUB_REPOSITORY"
          node scripts/data/production-executor.mjs verify-deploy --request tmp/production-request.json --evidence tmp/production-data-evidence.json
      - run: BETTER_AUTH_SECRET=ci-build-placeholder-secret-32-chars-minimum pnpm run build
      - name: Deploy exact compatible production commit
        id: production_pages_deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy ./dist --project-name "$CLOUDFLARE_PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" | tee tmp/production-deploy.txt
      - name: Record exact production deployment result
        if: always()
        run: node scripts/data/record-deployment.mjs --environment production --binding DB --reviewed-evidence tmp/production-request.json --commit "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --database-name serp-checklists-db --database-id b62ccc0a-9c69-4828-9e9b-3bac6ba0e4f1 --outcome "${{ steps.production_pages_deploy.outcome }}" --raw-output tmp/production-deploy.txt --report-dir tmp/data-reports/production-deploy
      - name: Record exact deployment URL
        run: |
          grep -Eo 'https://[a-zA-Z0-9.-]+\.pages\.dev' tmp/production-deploy.txt | tail -1 > tmp/production-deployment-url.txt
          test -s tmp/production-deployment-url.txt
      - name: Upload exact deployment report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-deploy-${{ github.run_id }}
          path: |
            tmp/production-deploy.txt
            tmp/production-deployment-url.txt
            tmp/data-reports/production-deploy/
          if-no-files-found: error
          retention-days: 90

  production_postdeploy:
    needs: production_deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      CONFIRM_PRODUCTION_DATABASE_ID: ${{ inputs.confirm_production_database_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-request-${{ github.run_id }}
          path: tmp
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-data-${{ github.run_id }}
          path: tmp
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: production-deploy-${{ github.run_id }}
          path: tmp
      - name: Reverify signed data evidence
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_PROTECTED_ENVIRONMENT: production
        run: |
          gh attestation verify tmp/production-data-evidence.json --repo "$GITHUB_REPOSITORY"
          node scripts/data/production-executor.mjs verify-deploy --request tmp/production-request.json --evidence tmp/production-data-evidence.json
      - name: Approved authenticated account-owned designated-canary read write readback restore and custom-domain smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          DATA_CANARY_OWNER_ID: ${{ secrets.PRODUCTION_DATA_CANARY_OWNER_ID }}
          DATA_CANARY_COOKIE: ${{ secrets.PRODUCTION_DATA_CANARY_COOKIE }}
          DATA_CANARY_TEMPLATE_ID: ${{ vars.PRODUCTION_DATA_CANARY_TEMPLATE_ID }}
          DATA_CANARY_RUN_ID: ${{ vars.PRODUCTION_DATA_CANARY_RUN_ID }}
          DATA_CANARY_EVIDENCE_HMAC_KEY: ${{ secrets.PRODUCTION_CANARY_EVIDENCE_HMAC_KEY }}
          DATA_CANARY_MUTATION_APPROVED: "true"
        run: |
          jq -e '.migrationRange | has("from") and has("to")' tmp/production-request.json > /dev/null
          node scripts/data/deployment-smoke.mjs --environment production --binding DB --migration-from "$(jq -r '.migrationRange.from // "none"' tmp/production-request.json)" --migration-to "$(jq -r '.migrationRange.to // "none"' tmp/production-request.json)" --database-name serp-checklists-db --database-id "$CONFIRM_PRODUCTION_DATABASE_ID" --deployment-url "$(cat tmp/production-deployment-url.txt)" --custom-domain https://serplists.com --report-dir tmp/data-reports/production-postdeploy
      - name: Publish complete production release report
        run: node scripts/data/finalize-production-release.mjs --request tmp/production-request.json --evidence tmp/production-data-evidence.json --deploy tmp/data-reports/production-deploy/production-deploy.json --smoke tmp/data-reports/production-postdeploy/production-postdeploy-smoke.json --deployment-url-file tmp/production-deployment-url.txt --report-dir tmp/data-reports/production-postdeploy
      - name: Upload production postdeploy reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-postdeploy-${{ github.run_id }}
          path: tmp/data-reports/production-postdeploy/
          if-no-files-found: error
          retention-days: 90

  production_failure_report:
    needs: [production_request, production_data, production_deploy, production_postdeploy]
    if: always() && github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && needs.production_request.result == 'success' && (needs.production_data.result == 'failure' || needs.production_data.result == 'cancelled' || needs.production_data.result == 'skipped' || needs.production_deploy.result == 'failure' || needs.production_deploy.result == 'cancelled' || needs.production_deploy.result == 'skipped' || needs.production_postdeploy.result == 'failure' || needs.production_postdeploy.result == 'cancelled' || needs.production_postdeploy.result == 'skipped')
    runs-on: ubuntu-latest
    env:
      REQUEST_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      REQUEST_DATABASE_ID: ${{ inputs.confirm_production_database_id }}
    steps:
      - name: Record fail-closed production stop
        run: |
          mkdir -p tmp/data-reports/production-failure
          printf '{"verdict":"fail","commit":"%s","environment":"production","databaseId":"%s","automaticRecovery":"forbidden","nextAction":"open incident and obtain fresh exact-target approval for a protected recovery executor or break-glass action"}\n' "$REQUEST_EXPECTED_COMMIT" "$REQUEST_DATABASE_ID" > tmp/data-reports/production-failure/production-failure.json
          printf 'STOPPED production promotion for commit %s in environment production and database %s. Automatic and direct operator restore are forbidden. Open an incident and obtain fresh exact-target approval before any protected recovery executor or break-glass action.\n' "$REQUEST_EXPECTED_COMMIT" "$REQUEST_DATABASE_ID" > tmp/data-reports/production-failure/production-failure.txt
          printf '<testsuite name="production-failure" tests="1" failures="1"><properties><property name="commit" value="%s"/><property name="environment" value="production"/></properties><testcase name="promotion"><failure message="fresh exact-target protected recovery approval required"/></testcase></testsuite>\n' "$REQUEST_EXPECTED_COMMIT" > tmp/data-reports/production-failure/production-failure.junit.xml
      - name: Upload production failure reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: production-failure-${{ github.run_id }}
          path: tmp/data-reports/production-failure/
          if-no-files-found: error
          retention-days: 90
