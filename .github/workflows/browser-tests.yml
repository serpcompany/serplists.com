name: Browser tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
  COREPACK_ENABLE_AUTO_PIN: "0"

jobs:
  browser-tests:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Restore the Next.js build cache
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: next-build-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-build-production-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        env:
          SITE_ENV: production
          NEXT_PUBLIC_RELEASE_COMMIT: ${{ github.sha }}
        run: pnpm run build:worker

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Every browser test
        run: pnpm run test:e2e:full -- --skip-build

      - name: Upload Playwright evidence (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  browser-tests-passed:
    name: Browser tests passed
    if: always()
    needs: [browser-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
