name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
  COREPACK_ENABLE_AUTO_PIN: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every fix commit adds a regression test
        if: github.event_name == 'pull_request'
        env:
          FIX_COMMIT_RANGE: origin/staging..${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/check-fix-commits.ts --range "$FIX_COMMIT_RANGE"

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Repository checks (comments, docs, sizes, secrets, duplicates, dead code, dependencies, linters, generated files)
        run: pnpm run verify

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

      - name: Local D1 fixture integration
        run: pnpm run test:local-d1

  db-parity:
    name: Drizzle schema parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare migrations with the Drizzle schema
        run: pnpm run check:db:drizzle-parity

  ci-passed:
    name: CI passed
    if: always()
    needs: [quality, db-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or had nothing to check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  deploy-staging:
    name: Deploy staging
    needs: [quality, db-parity]
    if: github.event_name == 'push' && github.ref_name == 'staging'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-staging.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}

  deploy-production:
    name: Deploy production
    needs: [quality, db-parity]
    if: github.event_name == 'push' && github.ref_name == 'main'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/deploy-production.yml
    secrets:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
      CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}

  deploy-failed:
    name: Report a failed deploy
    needs: [deploy-staging, deploy-production]
    if: always() && contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout the repository's actions
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          sparse-checkout: .github/actions
          persist-credentials: false

      - name: Open or update the issue for the environment whose deploy failed
        uses: ./.github/actions/deploy-failed
        with:
          environment: ${{ needs.deploy-staging.result == 'failure' && 'staging' || 'production' }}
