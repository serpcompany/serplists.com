name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
  COREPACK_ENABLE_AUTO_PIN: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:run

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Data regression gate
        run: pnpm run test:data-regressions -- --report-dir tmp/data-reports/ci

      - name: Upload data regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-regression-${{ github.run_id }}
          path: |
            tmp/data-reports/ci/
            tests/test-results/
            playwright-report/
          if-no-files-found: error
          retention-days: 90

      - name: Build
        run: pnpm run build
