name: CI

# One pipeline: every check must pass before anything deploys.
# Nothing deploys from here while the app moves to Next.js on Workers: the Pages deploy
# (cloudflare-pages-deploy.yml) has no caller, and the Workers deploy comes with the launch
# (docs/exec-plans/active/nextjs-migration.md, phase 4).
on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
  COREPACK_ENABLE_AUTO_PIN: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: sitemap lastmod dates are derived from git log.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Repository checks (secrets, docs, architecture, generated artifacts)
        run: pnpm run check:repo

      - name: Unit tests
        run: pnpm run test:run

      - name: Local D1 fixture integration
        run: pnpm run test:local-d1

      # The OpenNext build (next build, then the Worker bundle) that the browser tests serve.
      # They run the production configuration (tests/e2e/run-smoke-lib.mjs E2E_SITE_ENV), which
      # the build bakes into its headers, redirects and static pages.
      - name: Build
        env:
          SITE_ENV: production
        run: pnpm run build:worker

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # The build above, in workerd (opennextjs-cloudflare preview), on a D1 the runner seeds.
      - name: Smoke tests
        if: github.base_ref != 'main'
        run: pnpm run test:smoke -- --skip-build

      - name: Full end-to-end tests (promotions to main)
        if: github.base_ref == 'main'
        run: pnpm run test:e2e:full -- --skip-build

      - name: Upload Playwright evidence (traces, videos, screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore

  db-parity:
    name: Drizzle schema parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare migrations with the Drizzle schema
        run: pnpm run check:db:drizzle-parity
