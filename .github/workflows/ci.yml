name: CI

on:
  pull_request:
    branches:
      - main
      - staging
  push:
    branches:
      - main
      - staging
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BETTER_AUTH_SECRET: ci-build-placeholder-secret-32-chars-minimum
  COREPACK_ENABLE_AUTO_PIN: "0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Every fix commit adds a regression test
        if: github.event_name == 'pull_request'
        env:
          FIX_COMMIT_RANGE: origin/${{ github.base_ref }}..${{ github.event.pull_request.head.sha }}
        run: node --import tsx scripts/check-fix-commits.ts --range "$FIX_COMMIT_RANGE"

      - name: Validate environment contract
        run: pnpm run typecheck:env

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Repository checks (secrets, docs, comments, architecture, duplicates, dead code, generated artifacts)
        run: pnpm run check:repo

      - name: Unit tests
        run: pnpm run test:run

      - name: Local D1 fixture integration
        run: pnpm run test:local-d1

  db-parity:
    name: Drizzle schema parity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compare migrations with the Drizzle schema
        run: pnpm run check:db:drizzle-parity

  deploy-staging:
    name: Deploy staging
    needs: [quality, db-parity]
    if: github.event_name == 'push' && github.ref_name == 'staging'
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
