name: Code Review

# Claude reviews each pull request with the code-review plugin and posts an inline
# comment per issue it finds (or one summary comment when it finds none). Advisory:
# it never blocks merging. Setup and limits: docs/design-docs/agent-workflow.md.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    env:
      HAS_REVIEW_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
    steps:
      - name: Skip until the review token is configured
        if: env.HAS_REVIEW_TOKEN != 'true'
        run: echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the Claude review is skipped. See docs/design-docs/agent-workflow.md."

      - name: Checkout
        if: env.HAS_REVIEW_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # The plugin reads review guidelines from CLAUDE.md. This repo keeps them in
      # AGENTS.md and the core beliefs, so build CLAUDE.md on the runner only.
      - name: Give the reviewer the repository rules
        if: env.HAS_REVIEW_TOKEN == 'true'
        run: |
          {
            echo "<!-- Generated in CI from AGENTS.md and docs/design-docs/core-beliefs.md. Cite those files, not CLAUDE.md. -->"
            cat AGENTS.md
            echo
            cat docs/design-docs/core-beliefs.md
          } > CLAUDE.md

      - name: Review with Claude
        if: env.HAS_REVIEW_TOKEN == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
