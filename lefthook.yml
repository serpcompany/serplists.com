pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: pnpm secret:scan
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    typecheck-env:
      run: pnpm typecheck:env
    migration-provenance:
      run: pnpm run check:data:migration-provenance -- --base HEAD --report-dir tmp/data-reports/pre-commit
    schema-contract:
      run: pnpm run check:data:schema-contract -- --report-dir tmp/data-reports/pre-commit

pre-push:
  parallel: false
  commands:
    verification:
      run: pnpm secret:scan && pnpm run test:data-regressions -- --report-dir tmp/data-reports/pre-push
