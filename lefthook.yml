pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: node --import tsx scripts/secret-scan.ts {staged_files}
    lint:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    comments:
      glob: "*{.yml,.yaml,.toml,.sql,.css,.json,.jsonc,.xml,.xsd,.svg,.patch,.diff,.gitignore,.gitattributes,.npmrc,.dev.vars*,.env*}"
      run: node scripts/check-no-comments.mjs {staged_files}

pre-push:
  commands:
    verify:
      run: pnpm run verify
