pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: pnpm secret:scan
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    typecheck-env:
      run: pnpm typecheck:env
    unit-tests:
      run: pnpm test:unit

pre-push:
  parallel: false
  commands:
    secret-scan:
      run: pnpm secret:scan
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    typecheck-env:
      run: pnpm typecheck:env
    unit-tests:
      run: pnpm test:unit
