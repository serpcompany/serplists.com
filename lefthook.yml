# Installed automatically by `pnpm install` (the `prepare` script).
# Commit hooks stay fast (staged files only); push runs the full gate CI runs.
pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: node scripts/secret-scan.mjs {staged_files}
    lint:
      glob: "*.{ts,tsx,js,mjs,cjs}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}

pre-push:
  commands:
    verify:
      run: pnpm run verify
