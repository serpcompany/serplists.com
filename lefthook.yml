pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: pnpm secret:scan
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm typecheck
    typecheck-env:
      run: pnpm typecheck:env
    unit:
      run: pnpm test:unit
    migration-provenance:
      run: pnpm run check:data:migration-provenance -- --base HEAD --report-dir tmp/data-reports/pre-commit
    schema-contract:
      run: SCHEMA_CONTRACT_BASE_SHA="$(git merge-base HEAD origin/staging)" pnpm run check:data:schema-contract -- --report-dir tmp/data-reports/pre-commit

pre-push:
  parallel: false
  commands:
    verification:
      run: pnpm secret:scan && pnpm run verify:fast
