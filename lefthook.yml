pre-commit:
  parallel: true
  commands:
    verify:
      run: node --import tsx scripts/checks/cli.ts comments,sizes,secrets {staged_files}
    lint:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: node node_modules/eslint/bin/eslint.js --no-warn-ignored {staged_files}

commit-msg:
  commands:
    fix-needs-a-test:
      run: node --import tsx scripts/check-fix-commits.ts --commit-msg {1}

pre-push:
  commands:
    verify:
      run: node --import tsx scripts/run-at-low-priority.ts pnpm run verify
