pre-commit:
  parallel: true
  commands:
    secret-scan:
      run: node --import tsx scripts/secret-scan.ts {staged_files}
    lint:
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      run: pnpm exec eslint --no-warn-ignored {staged_files}
    comments:
      glob: "*{.yml,.yaml,.toml,.sql,.css,.json,.jsonc,.xml,.xsd,.svg,.md,.patch,.diff,.gitignore,.gitattributes,.npmrc,.dev.vars*,.env*}"
      run: node --import tsx scripts/check-no-comments.ts {staged_files}

commit-msg:
  commands:
    fix-needs-a-test:
      run: node --import tsx scripts/check-fix-commits.ts --commit-msg {1}

pre-push:
  commands:
    verify:
      run: node --import tsx scripts/run-at-low-priority.ts pnpm run verify
